name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: jq version
        run: jq --version
      - name: Run tests
        run: ./test.sh

  jq-1-6:
    # Oldest supported jq: Debian bullseye ships jq 1.6 and dash as /bin/sh.
    runs-on: ubuntu-latest
    container: debian:bullseye
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: apt-get update -qq && apt-get install -y -qq jq >/dev/null && jq --version
      - name: Run tests
        run: ./test.sh

  windows-git-bash:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: |
          command -v jq || choco install jq -y --no-progress
          jq --version
      - name: Run tests
        run: sh ./test.sh
