name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: jq version
        run: jq --version
      - name: Run tests
        run: ./test.sh

  jq-1-6:
    # Oldest supported jq: Ubuntu 22.04 ships jq 1.6 and dash as /bin/sh.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: apt-get update -qq && apt-get install -y -qq jq >/dev/null && jq --version
      - name: Run tests
        run: ./test.sh

  windows-git-bash:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: |
          command -v jq || choco install jq -y --no-progress
          jq --version
      - name: Run tests
        run: sh ./test.sh

  benchmark-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check jq
        run: jq --version
      - name: Test benchmark validation
        run: python -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Run isolated benchmark smoke test
        run: python benchmarks/benchmark.py --history-mib 1 --windows 1 2 --sessions 2 --repeats 1 --output benchmark-smoke.json

  windows-installer:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        variant: ["", "-Today"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Existing settings to keep
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "claude"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          '{"model":"opus","permissions":{"allow":["Bash(ls:*)"]},"statusLine":{"type":"command","command":"old"}}' | Set-Content -NoNewline (Join-Path $d "settings.json")
      - name: Install (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 ${{ matrix.variant }} -ClaudeDir (Join-Path $env:RUNNER_TEMP "claude")
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File .\install.ps1 ${{ matrix.variant }} -ClaudeDir (Join-Path $env:RUNNER_TEMP "claude")
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check settings and run the configured command
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "claude"
          $s = Get-Content -Raw (Join-Path $d "settings.json") | ConvertFrom-Json
          if ($s.model -ne "opus") { throw "model setting lost" }
          if ($s.permissions.allow[0] -ne "Bash(ls:*)") { throw "permissions lost" }
          if ($s.statusLine.command -eq "old") { throw "statusLine not updated" }
          if (-not (Get-ChildItem $d -Filter "settings.json.bak-*")) { throw "no backup" }
          Write-Host "command: $($s.statusLine.command)"
          # Run it the way Claude Code does on Windows: through Git Bash
          $env:CLAUDE_COST_DIR = Join-Path $env:RUNNER_TEMP "cost"
          $json = Get-Content -Raw examples/subscription.json
          $out = $json | & "C:\Program Files\Git\bin\bash.exe" -c $s.statusLine.command
          Write-Host "git bash: $out"
          if ("$out" -notmatch '^Opus 5\.5 \| ctx 42%') { throw "bad output: $out" }
