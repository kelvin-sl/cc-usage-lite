name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: jq version
        run: jq --version
      - name: Run tests
        run: ./test.sh

  jq-1-6:
    # Oldest supported jq: Ubuntu 22.04 ships jq 1.6 and dash as /bin/sh.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: apt-get update -qq && apt-get install -y -qq jq >/dev/null && jq --version
      - name: Run tests
        run: ./test.sh

  windows-git-bash:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: |
          command -v jq || choco install jq -y --no-progress
          jq --version
      - name: Run tests
        run: sh ./test.sh

  benchmark-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check jq
        run: jq --version
      - name: Test benchmark validation
        run: python -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Run isolated benchmark smoke test
        run: python benchmarks/benchmark.py --history-mib 1 --windows 1 2 --sessions 2 --repeats 1 --output benchmark-smoke.json
